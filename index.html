<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Favorite Person</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

</head>
<body>

    <div id="countdown-overlay">
        <div id="hearts-bg"></div>
        
        <div class="timer-wrapper">
            <h1 class="waiting-text">Counting down to our day...</h1>
            <div class="rolling-timer">
                <div class="time-group">
                    <span id="days" class="digit">00</span>
                    <span class="label">Days</span>
                </div>
                <span class="separator">:</span>
                <div class="time-group">
                    <span id="hours" class="digit">00</span>
                    <span class="label">Hours</span>
                </div>
                <span class="separator">:</span>
                <div class="time-group">
                    <span id="minutes" class="digit">00</span>
                    <span class="label">Mins</span>
                </div>
                <span class="separator">:</span>
                <div class="time-group">
                    <span id="seconds" class="digit">00</span>
                    <span class="label">Secs</span>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content">
        <div id="party-canvas"></div>
        
        <div class="content-wrapper">
            <h1 class="hero-text">Happy Birthday My Wife </h1>
            <h1 class="hero-text">16th🩷</h1>
            <h2 class="wife-name">Mikha Lady Saviora</h2>
            <p class="blessing-text">
                May God bless your day and always loving our family <br> 
                and also your lovely husband.
            </p>
            
            <div class="lyrics-card">
                <p class="lyrics-text">"We were both young when I first saw you..."</p>
                <p class="lyrics-text">-Khilmii da Husband</p>
             <a href="lyric.html">
                     <button id="play-button" class="btn-play">song always remind me about you</button>
             </a>
             <a href="Birthday-Website-main/">
                <button id="play-button" class="btn-play">special gift for you</button>
             </a>
            </div>
        </div>
    </div>
    <div class="gift-b">
    </div>
    <script src="script.js"></script>
</body>
</html>
